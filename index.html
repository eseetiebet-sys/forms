<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>FORMS & INPUT</h1>
    <form>
        <label for="firstname"></label> <br>
        Firstname:<br>
   <input type="text" name="firstname" placeholder="firstname"><br>
   Lastname:<br>
   <input type="text" name="lastname"><br>
   Email: <br>
   <input type="email" name="email"><br>
   Password: <br>
   <input type="password" name = "password"><br>
   Gender: <br>
   <input type="radio" name="gender" value="male" checked >Male <br>
    <input type="radio" name="gender" value="female" >Female <br>
     <input type="radio" name="gender" value="other" >Other <br>
     Courses: <br>
     <input type="checkbox" name="courses" value="frontend">Frontend <br>
     <input type="checkbox" name="courses" value="backend">Backend <br>
     <input type="checkbox" name="courses" value="fullstack"checked>Fullstack <br> <br>
     Date-of-birth: <br>
     <input type="date" name="date"><br> <br>
     Cars: <br>
     <select name="cars"> <br>
    <option value="cars">Cars</option> <br>
    <option value="lexus">Lexus</option> <br>
    <option value="toyota">Toyota</option> <br>
    <option value="benz">Benz</option> <br>
    </select> <br> <br>
    Message: <br>
    <textarea name="message"></textarea> <br> <br>
    <input type="submit" value="Send">
    </form>



</body>
</html>
